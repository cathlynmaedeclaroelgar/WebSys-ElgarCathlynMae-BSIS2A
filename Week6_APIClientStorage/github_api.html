<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub API</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<header>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Web Application
            </a>

            <a class="btn btn-outline-light" href="index.html">
                Home
            </a>

        </div>

    </nav>

</header>


<main class="container py-5">

    <section class="card shadow-sm">

        <div class="card-body">

            <h1 class="h3">
                GitHub User Lookup
            </h1>

            <p class="text-muted">
                Enter a GitHub username to view user information.
            </p>


            <input
                type="text"
                id="username"
                class="form-control mb-3"
                placeholder="Enter GitHub username"
            >


            <button
                onclick="getUser()"
                class="btn btn-primary"
            >
                Get User
            </button>


            <div id="userResult" class="mt-4"></div>

        </div>

    </section>

</main>


<script>

async function getUser() {

    let username =
        document.getElementById("username").value.trim();


    if (username === "") {

        document.getElementById("userResult").innerHTML =
            "<div class='alert alert-warning'>Please enter a username.</div>";

        return;

    }


    let url = `https://api.github.com/users/${encodeURIComponent(username)}`;

    try {

        let response = await fetch(url);


        if (!response.ok) {

            throw new Error("GitHub user not found.");

        }


        let data = await response.json();


        document.getElementById("userResult").innerHTML = `

            <div class="card">

                <div class="card-body text-center">

                    <img
                        src="${data.avatar_url}"
                        alt="GitHub profile"
                        width="120"
                        height="120"
                        class="rounded-circle mb-3"
                    >

                    <h2 class="h4">
                        ${data.name || "No Name Found"}
                    </h2>

                    <p>
                        <strong>Username:</strong>
                        ${data.login}
                    </p>

                    <p>
                        <strong>Public Repositories:</strong>
                        ${data.public_repos}
                    </p>

                    <p>
                        <strong>Followers:</strong>
                        ${data.followers}
                    </p>

                    <p>
                        <strong>Following:</strong>
                        ${data.following}
                    </p>

                    <a
                        href="${data.html_url}"
                        target="_blank"
                        class="btn btn-dark"
                    >
                        View GitHub Profile
                    </a>

                </div>

            </div>

        `;

    } catch (error) {

        document.getElementById("userResult").innerHTML = `

            <div class="alert alert-danger">
                ${error.message}
            </div>

        `;

    }

}

</script>

</body>
</html>
